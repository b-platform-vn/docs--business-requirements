<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Ecosystem Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Platform Ecosystem Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Platform Ecosystem Docs',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search',
        noData: 'No Results',
        depth: 6
      }
    }
  </script>
  <!-- Mermaid -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    function renderMermaid() {
      var codes = document.querySelectorAll('code.language-mermaid, code.lang-mermaid, code[lang="mermaid"]');
      codes.forEach(function(codeEl) {
        var pre = codeEl.closest('pre');
        if (!pre || pre.getAttribute('data-mermaid-processed') === 'true') return;

        var wrapper = document.createElement('div');
        wrapper.className = 'mermaid';
        wrapper.textContent = codeEl.textContent || '';
        pre.setAttribute('data-mermaid-processed', 'true');
        pre.parentNode.replaceChild(wrapper, pre);
      });

      if (document.querySelector('.mermaid')) {
        mermaid.run({ querySelector: '.mermaid' });
      }
    }

    window.$docsify = window.$docsify || {};
    window.$docsify.plugins = (window.$docsify.plugins || []).concat([
      function(hook) {
        hook.doneEach(function() {
          setTimeout(renderMermaid, 0);
        });
      }
    ]);
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Emoji plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
</body>
</html>
